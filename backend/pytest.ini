[pytest]
; プレゼンテーション向けテストスイート設定
; pytest-html によって tests/report/test_report.html にレポートを出力する

testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; HTML レポート出力先とタイトル設定
addopts =
    --tb=short
    --strict-markers
    -q

; カスタムマーカー定義
markers =
    slow: 実行時間が長いテスト（外部 API 呼び出しを含む）
    integration: 統合テスト（DB・Redis・外部サービスを使用）
    unit: ユニットテスト（モックのみ、外部依存なし）
    presentation: 顧客プレゼン向けテスト
